name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/chess-platform-ai-engine-3k5iwv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes supersede older ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (source: GitHub Actions) on first run if needed.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The app is fully static — deploy the repo as-is.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
